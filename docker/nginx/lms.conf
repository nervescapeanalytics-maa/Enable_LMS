# =============================================================================
# Enable-LMS — Nginx Site Configuration
# Routes: API → Gunicorn, WebSocket → Daphne, Static → filesystem
# =============================================================================

upstream lms_api {
    server api:8000;
    keepalive 32;
}

upstream lms_websocket {
    server websocket:8001;
}

# Proxy cache for static assets
proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m;

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    # ── TLS — Origin certificate (self-signed; Cloudflare terminates public TLS)
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Docker embedded DNS resolver — re-resolve upstream names on each request
    # so nginx picks up new container IPs after restarts/recreates.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Use variables for upstream addresses so they are resolved at request time
    # via the resolver above (NOT cached forever from `upstream` blocks).
    set $api_backend       "api:8000";
    set $websocket_backend "websocket:8001";

    # ── Cloudflare Real IP — trust CF edge IPs, expose visitor IP ──────────
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # ── Health check for Nginx itself (no upstream) ──
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Static files (served directly from shared volume) ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ──
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── WebSocket connections → Daphne ──
    location /ws/ {
        proxy_pass http://$websocket_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Login endpoint — stricter rate limiting ──
    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
    }

    # ── API endpoints — rate limited ──
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Health check (no auth, no rate limit, no SSL redirect) ──
    location /health/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        access_log off;
    }

    # ── All other routes → Gunicorn (Django views, admin, etc.) ──
    location / {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Deny access to hidden files ──
    location ~ /\. {
        deny all;
    }
}
