# =============================================================================
# Enable-LMS — Nginx Main Configuration
# Enterprise-grade reverse proxy
# =============================================================================
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffers
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers (applied globally)
    # NOTE: X-Frame-Options is intentionally SAMEORIGIN so that Django admin
    # views (e.g. monitoring dashboard) can be embedded in same-origin iframes
    # via the @xframe_options_sameorigin decorator. Per-view DENY can still be
    # enforced by Django's response header on sensitive views.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Pass Cloudflare's original scheme (https) through to Django.
    # When Cloudflare is in Flexible SSL mode it sets X-Forwarded-Proto: https
    # on the HTTP request it sends to origin. Preserve that value; fall back
    # to $scheme for direct connections.
    map $http_x_forwarded_proto $real_proto {
        default $scheme;
        https   https;
        http    http;
    }

    include /etc/nginx/conf.d/*.conf;
}
