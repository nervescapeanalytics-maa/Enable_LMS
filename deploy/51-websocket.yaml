# =============================================================================
# Django ASGI WebSocket server — Daphne
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  namespace: lms-prod
  labels: { app: websocket }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: websocket }
  template:
    metadata:
      labels: { app: websocket }
    spec:
      imagePullSecrets:
        - name: acecloud-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: websocket
          image: registry.internal.acecloud.io/enable-lms/api:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          args: ["daphne"]
          ports:
            - containerPort: 8001
              name: ws
          envFrom:
            - configMapRef: { name: lms-config }
            - secretRef:    { name: lms-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: websocket
  namespace: lms-prod
  labels: { app: websocket }
spec:
  selector: { app: websocket }
  ports:
    - port: 8001
      targetPort: 8001
      name: ws
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: websocket-hpa
  namespace: lms-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: websocket
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: websocket-pdb
  namespace: lms-prod
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: websocket }
