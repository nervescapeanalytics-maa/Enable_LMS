# =============================================================================
# Nginx — reverse proxy, static/media serving.
# Exposed ONLY inside the cluster; Cloudflare Tunnel points to this Service.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: lms-prod
  labels: { app: nginx }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      imagePullSecrets:
        - name: acecloud-registry
      containers:
        - name: nginx
          image: registry.internal.acecloud.io/enable-lms/nginx:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 256Mi }
          readinessProbe:
            httpGet: { path: /nginx-health, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /nginx-health, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: media
              mountPath: /app/media
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: lms-prod
  labels: { app: nginx }
spec:
  selector: { app: nginx }
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-pdb
  namespace: lms-prod
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: nginx }
