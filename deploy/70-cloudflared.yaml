# =============================================================================
# Cloudflare Tunnel connector — the ONLY way public traffic reaches the stack.
# 2 replicas for HA; both share the same tunnel token, Cloudflare load-balances.
#
# Cloudflare Zero Trust dashboard must be updated to route:
#   lms.automatebot.shop -> http://nginx.lms-prod.svc.cluster.local:80
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: lms-prod
  labels: { app: cloudflared }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(CF_TOKEN)
          env:
            - name: CF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lms-secrets
                  key: CLOUDFLARE_TUNNEL_TOKEN
          ports:
            - containerPort: 2000
              name: metrics
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-pdb
  namespace: lms-prod
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: cloudflared }
